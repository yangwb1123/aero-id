# aero-id B3 批次实施 campaign（隔离完成 + 门禁盲区关闭 + 契约同步）
# 前置：B2（2026-08-08，commit 2ec2383/b005409）已隔离 internal/{block,comment,search}
#       死树并落地 in-tx 审计、composition-root 门禁、check-audit-swallow FM-12 tripwire。
# B3 落地（2026-08-12 实证，全部绿灯）：
#   - B3-1/B3-2：internal/{file,message,notification,audit} 隔离落地（0df296f）+
#     ADR-012 加固（f7bb878/27d9c68/60fb785：锚定 pin、guard-PASS 计数器、相邻路径守卫、
#     FM-16 常驻 pin、Option B no-arg 全量默认）；check-architecture 实层对齐（1001002）
#   - B3-3：check-proto-sync 确定性门禁 + CI（c8acd14）
# 用法（aero-id 仓库内）：
#   python3 pi-batch.py campaign --config docs/campaigns/campaign-aero-id-b3.yaml --dry-run
#   python3 pi-batch.py campaign --config docs/campaigns/campaign-aero-id-b3.yaml \
#     --jobs 4 --max-directions 3 --validate gobuild,gotest,pyquality

name: aero-id-b3-quarantine-gates-contracts

discovery:
  roots:
    - internal
    - cmd
    - configs
    - scripts
  exclude:
    - testdata
    - gen
    - generated
    - mock
    - mocks
    - tests
    - docs
    - examples
    - logs
    - vendor
    - .git
    - .github
    - .pi-batch
    - __pycache__
    - ai-dev
    - pbatch
    - worktrees
  max_depth: 2
  fallback_top_level: true

analysis:
  jobs: 4
  retries: 2
  candidate_limit: 3
  prompt: |
    Analyze module '{module}' at {module_path} of aero-id (Go control plane
    for account aggregation/audit/operations). Repo state (verified 2026-08-10):
    B2 batch landed and ALL gates are green (test/lint/lint-strict/
    check-file-sizes/check-audit-swallow/check-anchored-event-ids/
    check-audit-manifest/check-composition-root/check-integration-compile/build).
    Dead trees internal/{block,comment,search} were quarantined (deleted +
    gate tripwires). Target architecture: docs/plans/2026-08-04-distributed-account-aggregation.md.
    The live runtime is wired only from internal/app/new.go (internal/service +
    internal/repository); docs/AGENTS.md 'gotchas' section documents known debt.

    PRE-VERIFIED gap inventory (re-check each claim against the current tree
    before proposing; mark PROPOSED when you cannot verify from code):
    1. [LANDED 2026-08-12, 0df296f + f7bb878/27d9c68/60fb785] Dead-tree
       quarantine internal/{file,message,notification,audit} + FM-12 guards +
       ADR-012 hardening. Do not re-propose.
    2. [OPEN — top remaining B3 gap] check-audit-swallow scans only
       internal/{service,repository,app,storage,block,comment,cmd} + the four
       quarantine roots; internal/{connector,outbox,event,hub,region,sso,
       idempotency,middleware,config,handler} are unscanned (the B2-2 blind
       spot). Verified 2026-08-12: P1 hits = 0; P2 hits = exactly 3
       `c.breaker.Record(` at internal/sso/client.go:299,306,310 (circuit-
       breaker observations, not audit writes; the script header already
       documents the needed exemption); generated `*_pb.go` (auditpb, aeropb,
       ssopb) must be excluded mechanically. Candidate: extend Makefile roots
       + no-arg default + membership tripwires, add a narrow `c.breaker.Record(`
       line filter + `--exclude='*_pb.go'`, add a fixture proving the breaker
       exemption cannot hide a real audit swallow, update usage header/
       comments, full done-gate green.
    3. [LANDED c8acd14] check-proto-sync deterministic stub sync gate + CI.
       Do not re-propose.
    4. [PARTIALLY LANDED] AGENTS.md audit-exemption list: quarantine commit
       reconciled comment ops + best-effort sentence; remaining live
       exemptions (file create/delete/update, message send/edit/react,
       preferences, region promotion, projection replication) are documented
       with per-op evidence. Only propose per-op re-verification if you find
       drift.
    5. [REJECTED] proto split of aero_id.proto (~120 RPCs) — high churn, low
       value. Do not propose unless the value clearly outweighs regen risk.
    6. [LANDED 1001002] check-architecture realignment to the live layered
       runtime. Do not re-propose.

    For each direction you propose, map acceptance checks to concrete
    existing gates (make test / lint / check-* names) plus at least one new
    regression test. Return ONLY a JSON array with at most {candidate_limit}
    high-value directions, sorted by value. Each object must contain:
    title, problem, value (1-10), risk_reduction (1-10), effort (1-10),
    confidence (1-10), evidence (existing file/symbol paths), acceptance
    (testable checks). Do not modify code. Claims without repository
    evidence must be marked proposed, not verified.

selection:
  max_directions: 3
  minimum_score: 0

implementation:
  pipeline: examples/repository-campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  timeout: 14400
  worktree_root: .pi-batch/worktrees

state:
  output_dir: docs/auto
  state_file: docs/auto/state.jsonl
  summary_file: docs/auto/SUMMARY.md
  line_max_bytes: 262144

estimates:
  analysis_minutes: 3
  pipeline_minutes: 25
