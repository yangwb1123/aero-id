app:    { name: aero-id, env: dev, version: 0.1.0 }
server:
  http: { host: 0.0.0.0, port: 8080, read_timeout: 15s, write_timeout: 15s, shutdown_timeout: 10s, idempotency_ttl: 24h }
  grpc: { host: 0.0.0.0, port: 9090 }
database:
  host: 127.0.0.1
  port: 5432
  user: aero
  password: aero
  dbname: aero_id
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 1h
  log_level: warn
sso:
  endpoint: 127.0.0.1:9000
  timeout: 5s
  insecure: true
  readiness_critical: false   # when true, /readyz returns 503 if SSO is unreachable
  token_cache_ttl: 60s
  stale_ttl: 300s             # serve last-known identity up to this long past expiry when SSO is down (0 = off)
  user_cache_ttl: 300s
  breaker_threshold: 5        # consecutive SSO availability failures before fast-failing new tokens (0 = off)
  breaker_cooldown: 10s       # how long to fast-fail before admitting a single recovery probe
  max_attempts: 3             # upstream tries per call within the timeout budget (1 = no retry)
  retry_backoff: 50ms         # base exponential backoff between availability-error retries
  keepalive_time: 30s         # send a keepalive ping after this much idle time
  keepalive_timeout: 10s      # wait this long for the keepalive ping ack before closing
  # TLS / mTLS (used only when insecure=false; empty tls_ca_file falls back to the system cert pool):
  tls_ca_file: ""             # CA bundle to verify the SSO server
  tls_cert_file: ""           # client certificate for mTLS (pair with tls_key_file)
  tls_key_file: ""            # client key for mTLS (pair with tls_cert_file)
  tls_server_name: ""         # override the verified server hostname (e.g. behind a proxy)
tracing:
  enabled: false              # opt-in; when false (and endpoint empty) a no-op tracer is installed
  endpoint: ""                # OTLP/gRPC collector address, e.g. "localhost:4317" (setting it also enables tracing)
  insecure: true              # dial the collector without TLS (dev)
  timeout: 5s                 # exporter timeout
  sample_ratio: 0             # 0 or >=1 => always sample; otherwise parent-based ratio sampler
storage:
  type: local
  max_upload_bytes: 52428800   # 50 MiB; 0 = unlimited
  allowed_mime_types: []       # empty = accept any content type
  local:
    root: ./data/files
    public_base_url: http://127.0.0.1:8080
signing_key: change-me-please-very-long-random
log:    { level: info, encoding: console }
