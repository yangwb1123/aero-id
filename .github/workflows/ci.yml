name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check web console
        working-directory: web
        run: pnpm check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./internal/...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./... -count=1 -race

  # Deterministic proto-stub sync gate (B3): regenerates every committed *.pb.go
  # from api/proto/ with the pinned toolchain into a temp tree and diffs. Fail-
  # closed and self-testing (green+red fixtures). Requires protoc 3.21.12, which
  # ubuntu-24.04 ships exactly; the gate asserts the version and fails otherwise.
  # Runs on every PR/push (no paths filter): inputs are protos, stubs, go.mod
  # (plugin pins), and the Makefile (parity guard), so a filter would recreate
  # the blind spot this gate closes.
  check-proto-sync:
    runs-on: ubuntu-24.04
    env:
      # Supply-chain pinning (F2): the gate's `go install` fetches the
      # protoc-gen-go plugins. Force the official proxy + checksum DB and keep
      # GOPRIVATE empty so google.golang.org modules are never treated as
      # private (which would bypass GOSUMDB verification; GONOSUMDB/GONOPROXY
      # inherit empty from GOPRIVATE).
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      GOPRIVATE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install protoc (3.21.12)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Proto-stub sync gate
        run: make check-proto-sync

  # Quarantine + live-layer gate tripwires (B3): the FM-12 must-not-exist
  # guards, fixture-mode self-tests, and Makefile tripwire roots are enforced
  # on every PR/push. The Makefile invocation is load-bearing: it carries the
  # four quarantine roots and the membership tripwires. No paths filter: a
  # filter would recreate the blind spot this gate closes. Pure bash + grep —
  # no Go toolchain, no network, no Docker.
  check-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit-swallow gate (incl. quarantine tripwires)
        run: make check-audit-swallow
      - name: Architecture gate (live-layer boundaries)
        run: make check-architecture
      # Load-test tooling drift gate (P6-08): canonical ghz scenario source
      # (calls resolve in the proto, runner == scenarios.yaml), bench SQL
      # relations exist in migrations, Makefile-referenced load assets are
      # live. Pure bash + grep, self-testing fixtures — no Go toolchain, no
      # network, no Docker. No paths filter: a filter would recreate the
      # blind spot this gate closes.
      - name: Load-scenario drift gate (single-source ghz scenarios, bench schema, load liveness)
        run: make check-load-scenarios
      # Migration-set integrity gate (2026-08-16): up/down pair invariant, no
      # duplicate versions, no malformed migration-like filenames — enforced
      # by strict Discover() (internal/pkg/migrate) and this bash gate.
      # Pure bash + grep, self-testing fixtures — no Go toolchain, no Docker,
      # no network. No paths filter: a filter would recreate the blind spot
      # this gate closes (a broken migration set must never ship).
      - name: Migration-set integrity gate
        run: make check-migration-set
