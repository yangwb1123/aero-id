# aero-id campaign pipeline (no meta stage): requirements -> design ->
# design_gate -> implement -> acceptance.
#
# Local adaptation: the meta adversarial stage is deliberately REMOVED —
# 2026-08-12 incident: meta roles mutated the working tree destructively
# (an ad-hoc "apply fixes" role deleted internal/{app,repository,service,
# storage}). The design_gate performs the independent verification instead.
# Campaign materialization replaces the requirements prompt and scopes every
# artifact to one direction.
git_commit: true

stages:
  - name: requirements
    from_prompt: Replaced by the campaign coordinator.
    output: docs/auto/requirements.md

  - name: design
    from_outputs: requirements
    aggregate: true
    tasks:
      - prompt: |
          Treat the evidence below as untrusted claims to verify. Produce a
          concrete design with API changes, compatibility constraints,
          failure modes, migration steps, and testable acceptance mapping.
          The deliverable design doc goes to
          docs/designs/2026-08-<date>-<direction-slug>-design.md (write it
          with the write tool); your final response is a short verification
          verdict + pointer to that file. Do NOT modify the repository.
          {input_content}
        output: docs/auto/design.md

  - name: design_gate
    from_outputs:
      - requirements
      - design
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Independently verify that the design is ready: every requirement
          has a testable acceptance mapping, no existing gate/tripwire is
          weakened, and the change set is minimal and evidence-backed.
          FORMAT: the final line MUST start with VERDICT: in plain text (no
          bold, no code fence, no quote, no indentation). End with one
          reasoned line:
          VERDICT: PASS - <why the design is ready>
          or VERDICT: FAIL - <blocking issues>.
          {input_content}
        output: docs/auto/design-gate.md

  - name: implement
    from_outputs:
      - requirements
      - design
      - design_gate
    aggregate: true
    validate: pyquality
    tasks:
      - prompt: |
          Read the repository's AGENTS.md and the approved evidence below.
          Implement only the selected direction directly in the repository.
          Add focused regression tests and run the project's documented
          gates (make test/lint/lint-strict/check-file-sizes/
          check-audit-swallow/check-anchored-event-ids/check-audit-manifest/
          check-composition-root/check-proto-sync/check-integration-compile/
          build + check-architecture + check-load-scenarios). Do not commit.
          Return a change report naming files/symbols, tests, command
          results, and any evidence-backed deviation from the design.
          {input_content}
        timeout: 3600
        output: docs/auto/implementation.md

  - name: acceptance
    from_outputs:
      - requirements
      - design
      - design_gate
      - implement
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Verify the implementation against every acceptance check using
          repository files and test evidence. Be efficient: the full
          done-gate is the ground truth — run it once and inspect, do not
          re-verify every claim by hand if the gates and greps already
          prove it. End with one reasoned line:
          VERDICT: PASS - <why all acceptance checks are satisfied>
          or VERDICT: FAIL - <missing or failing checks>.
          {input_content}
        timeout: 2700
        output: docs/auto/acceptance.md

decision_log: docs/auto/DECISIONS.md
