syntax = "proto3";

package snaplink.authz.v1;

option go_package = "github.com/aero/aero-id/internal/sso/authzpb;authzpb";

service Authorizer {
  rpc Check(CheckRequest) returns (CheckResponse);
  rpc ListPermissions(SubjectRequest) returns (PermissionList);
  rpc ListRoles(SubjectRequest) returns (RoleList);
  rpc GetMenus(SubjectRequest) returns (MenuTree);
}

message CheckRequest {
  string subject_id = 1;
  string client_id = 2;
  string permission = 3;
}

message CheckResponse { bool allowed = 1; }

message SubjectRequest {
  string subject_id = 1;
  string client_id = 2;
}

message Permission { string code = 1; string resource = 2; }
message PermissionList { repeated Permission permissions = 1; }

message Role {
  string code = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
}
message RoleList { repeated Role roles = 1; }

message Button { string code = 1; string name = 2; string permission = 3; }
message MenuItem {
  string id = 1;
  string name = 2;
  string path = 3;
  string icon = 4;
  string permission = 5;
  repeated Button buttons = 6;
  repeated MenuItem children = 7;
}
message MenuTree { repeated MenuItem items = 1; }
