openapi: 3.1.0
info:
  title: aero-id Account Aggregation API
  version: 1.0.0
  description: |
    Account control-plane API for the independent aero-account-console. Snaplink
    remains the authentication and authorization authority; source data is
    exposed only through the allow-listed aggregation datasets. Aero ID locally
    verifies the exact JWT issuer and audience plus expiry, subject, and tenant;
    no request body, query, or forwarding header can select a tenant.
servers:
  - url: /v1
security:
  - snaplinkBearer: []
paths:
  /command-intents:
    post:
      operationId: prepareCommandIntent
      description: >-
        Persist a five-minute server-owned normalized preview without source calls or execution.
        Requires verified claims and explicit datasets for sync/export/erase. Local metadata
        versions and writer fencing are not source ACLs or causal watermarks.
      parameters:
        - {$ref: '#/components/parameters/RequiredIdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CommandIntentRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/CommandIntent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /command-intents/by-key:
    get:
      operationId: findOriginalCommandIntentByKey
      description: >-
        Read-only original-caller lookup using the original Idempotency-Key header.
        No preparation, source call or new execution. A 404 is not proof that an older
        in-flight prepare cannot still commit and does not authorize a replacement key.
        The returned key digest binds the lookup without echoing the original key.
      parameters:
        - {$ref: '#/components/parameters/RequiredIdempotencyKey'}
      responses:
        '200':
          description: Original intent metadata and SHA-256 key binding; Cache-Control no-store.
          content: {application/json: {schema: {$ref: '#/components/schemas/CommandIntentLookupEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /command-intents/{id}:
    get:
      operationId: getCommandIntent
      parameters:
        - {$ref: '#/components/parameters/ID'}
      description: Caller/issuer/subject/client/tenant scoped; never an authorization grant.
      responses:
        '200': {$ref: '#/components/responses/CommandIntent'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /command-intents/{id}/execute:
    post:
      operationId: executeCommandIntent
      parameters:
        - {$ref: '#/components/parameters/ID'}
      description: >-
        Reauthorize and replan the persisted request. Compare current local metadata,
        version and expiry in the same transaction as the existing Operation/Sync receipt
        and audit. Confirmed retries return that receipt; no automatic run or rollback.
        Snaplink policy versions and source resource ACL versions remain unsupported/unknown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, confirmation_digest]
              properties:
                version: {type: integer, format: int64, minimum: 1}
                confirmation_digest: {type: string, pattern: '^v1:[0-9a-f]{64}$'}
      responses:
        '200': {$ref: '#/components/responses/CommandIntent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /command-intents/{id}/abandon:
    post:
      operationId: abandonUnexecutedCommandIntent
      parameters:
        - {$ref: '#/components/parameters/ID'}
      description: >-
        Explicit original-caller withdrawal of receipt admission, serialized with execute.
        The original version/digest are required. No renewed generation/source grant is needed
        to close one's own preview; no source call, receipt, purge or Legal Hold release occurs.
        If execute won, returns its original executed receipt, not cancellation. If withdrawal
        won, returns immutable abandoned version 2 and old/in-flight execute is fenced out.
        Expired/stale/erased previews may be withdrawn at the current home-region writer.
        Repeated withdrawal returns the original result without another audit fact.
        Plan, key, original expiry and audit are retained. A new preview remains a separate,
        explicitly requested, freshly authorized command; withdrawal never prepares it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, confirmation_digest]
              properties:
                version: {type: integer, const: 1}
                confirmation_digest: {type: string, pattern: '^v1:[0-9a-f]{64}$'}
      responses:
        '200': {$ref: '#/components/responses/CommandIntent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /account-datasets:
    get:
      operationId: listAccountDatasets
      security: [{snaplinkBearer: []}]
      responses:
        '200':
          $ref: '#/components/responses/DatasetList'
        '401': {$ref: '#/components/responses/Error'}
  /me:
    get:
      operationId: getMyAccount
      responses:
        '200': {$ref: '#/components/responses/AccountView'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me/capabilities:
    get:
      operationId: getMyCapabilities
      description: >-
        Content-free control-plane eligibility and local projection freshness.
        No source fan-out, no source resource authorization grant. Snaplink Check
        currently has no policy version; commands always reauthorize. Errors in
        permission/projection dependencies produce redacted unknown/partial states.
      responses:
        '200':
          description: Verified caller-scoped capability report; Cache-Control no-store.
          content: {application/json: {schema: {$ref: '#/components/schemas/CapabilityEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me/sources:
    get:
      operationId: listMySources
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Source account references with per-source status and freshness.
          content: {application/json: {schema: {$ref: '#/components/schemas/SourceListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
  /me/memberships:
    get:
      operationId: listMyMemberships
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Memberships keyed by source and scope; never collapsed into one tenant.
          content: {application/json: {schema: {$ref: '#/components/schemas/MembershipListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
  /me/activity:
    get:
      operationId: listMyActivity
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Recent account activity from local projections.
          content: {application/json: {schema: {$ref: '#/components/schemas/ActivityEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me/erase:
    post:
      operationId: eraseMyAccount
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: Erase saga accepted; track via /sync/jobs.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /me/profile:
    get:
      operationId: getMyProfile
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilePatch'}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me/data:
    get:
      operationId: getMyAggregatedData
      parameters:
        - {$ref: '#/components/parameters/Dataset'}
        - {$ref: '#/components/parameters/Consistency'}
        - {$ref: '#/components/parameters/MaxAge'}
      responses:
        '200': {$ref: '#/components/responses/Aggregate'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me/overview:
    get:
      operationId: getMyOverview
      parameters:
        - {$ref: '#/components/parameters/Dataset'}
        - {$ref: '#/components/parameters/Consistency'}
        - {$ref: '#/components/parameters/MaxAge'}
      responses:
        '200': {$ref: '#/components/responses/Aggregate'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me/resources:
    get:
      operationId: getMyResources
      parameters:
        - {$ref: '#/components/parameters/Dataset'}
        - {$ref: '#/components/parameters/Consistency'}
        - {$ref: '#/components/parameters/MaxAge'}
      responses:
        '200': {$ref: '#/components/responses/Aggregate'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me/sync:
    post:
      operationId: createMySyncJob
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '201': {$ref: '#/components/responses/SyncJob'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me/export:
    post:
      operationId: createMyExportJob
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '201': {$ref: '#/components/responses/SyncJob'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /sync/jobs:
    get:
      operationId: listSyncJobs
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/SyncJobList'}
  /sync/jobs/{id}:
    get:
      operationId: getSyncJob
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {$ref: '#/components/responses/SyncJob'}
        '404': {$ref: '#/components/responses/Error'}
  /sync/jobs/{id}/reconcile:
    post:
      operationId: reconcileSyncJob
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/WorkerID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {$ref: '#/components/responses/SyncJob'}
        '409': {$ref: '#/components/responses/Error'}
  /sync/jobs/{id}/export/download:
    get:
      operationId: downloadExport
      description: >-
        Requires complete verified caller claims and direct current Snaplink
        account.export, or both audit.export and audit.read for audit artifacts,
        before object IO and again before final local admission. Each checkpoint
        shares a three-second authorization budget across its grants, inheriting
        earlier request deadlines; this is not a whole-download deadline or a
        policy-version/session transaction. Missing authority, outage, cancellation
        and late success fail closed without legacy/owner/initiator fallback.
        Download-handler responses are no-store; this does not cover upstream
        proxy/authentication middleware responses. Admission commits one-time pointer consumption
        and successful-read audit atomically. A lost response or uncertain disposal
        may prevent another download; never regenerate or extend the original TTL.
        Already-admitted bytes cannot be recalled after revocation or erase.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - in: query
          name: one_time
          schema: {type: boolean, default: false}
          description: Only the literal true requests one-time pointer consumption.
      responses:
        '200':
          description: Original export content after current authorization, identity, integrity, expiry and atomic audit admission.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {type: object}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /operations:
    post:
      operationId: createOperation
      description: >-
        Creates a durable operation. For every step with source `aero-im` and
        action `sync`, `summary`, `source.summary`, `erase`, `delete`, or
        `source.erase`, `request_payload.datasets` is required and must be a
        non-empty array of unique, exact registry names. The current Aero IM
        names are `aero-im.profile`, `aero-im.workspaces`,
        `aero-im.activity_summary`, and `aero-im.notifications`. Invalid scope
        returns `operation.invalid_dataset_scope` and no source call is made.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationRequest'}
      responses:
        '201': {$ref: '#/components/responses/Operation'}
        '400': {$ref: '#/components/responses/Error'}
    get:
      operationId: listOperations
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/OperationList'}
  /operations/{id}:
    get:
      operationId: getOperation
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '404': {$ref: '#/components/responses/Error'}
  /operations/{id}/run:
    post:
      operationId: runOperation
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/WorkerID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '409': {$ref: '#/components/responses/Error'}
  /operations/{id}/reconcile:
    post:
      operationId: reconcileOperation
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/WorkerID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '409': {$ref: '#/components/responses/Error'}
  /audit/events:
    get:
      operationId: listAuditEvents
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: operation_id, in: query, schema: {type: string, format: uuid}}
        - {name: request_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Append-only, redacted audit facts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditList'}
        '403': {$ref: '#/components/responses/Error'}
  /audit/verify:
    get:
      operationId: verifyAuditChain
      security: [{snaplinkBearer: []}]
      parameters:
        - {name: source, in: query, required: true, schema: {type: string}}
        - {name: partition, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Audit chain hash-chain verification result.
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /audit/operations/{id}:
    get:
      operationId: getOperationTimeline
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: >-
            One bounded page of redacted local audit facts for the requested
            operation_id in the authenticated tenant, not Operation steps or
            attempts. Current audit.read and durable read audit remain required.
            An empty page proves neither absent history nor absent remote effects.
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationAuditEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /audit/replays:
    post:
      operationId: createAuditReplay
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplayRequest'}
      responses:
        '201':
          description: One bounded forensic/dry-run window completed, or a controlled replay operation was created.
          content: {application/json: {schema: {$ref: '#/components/schemas/ReplayEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /audit/replays/projection:
    post:
      operationId: replayProjection
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [account_id, source]
              properties:
                account_id: {type: string, format: uuid}
                source: {type: string, enum: [snaplink, aero-im, aero-vault, aero-id]}
                cursor: {type: string, format: uuid, description: Opaque next_cursor returned by the previous bounded window.}
                limit: {type: integer, minimum: 1, maximum: 10000}
      responses:
        '200':
          description: One bounded, tenant-scoped shadow projection window rebuilt from the event store and compared with live; every successful sensitive read is durably audited.
          content: {application/json: {schema: {$ref: '#/components/schemas/ProjectionReplayEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /audit/export:
    post:
      operationId: createAuditExport
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditExportRequest'}
      responses:
        '201':
          description: Asynchronous audit export job created; track the returned root job_id via /sync/jobs. Creation does not prove artifact availability or remote completion.
          content: {application/json: {schema: {$ref: '#/components/schemas/AuditExportEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/callback-subscriptions:
    get:
      operationId: listCallbackSubscriptions
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Callback subscriptions for this tenant.
          content: {application/json: {schema: {$ref: '#/components/schemas/CallbackListEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createCallbackSubscription
      description: >-
        Verifies the HTTPS challenge under one configured network-phase deadline,
        including DNS, connection-time revalidation, dial/TLS, response headers and
        bounded body reads; phases never renew that deadline. Rejects disallowed
        or mixed special-use/private/shared-address answers and more than 32
        resolved addresses. No userinfo, redirects or ambient HTTP proxies; normal
        TLS verification applies. Response headers are capped at 64 KiB. A late
        challenge cannot create a subscription. Network cancellation cannot undo
        an already-received request; database persistence is outside this network budget.
        Registration retains its limited response-cache contract, not durable
        client/body/version-bound business idempotency.
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CallbackCreateRequest'}
      responses:
        '201':
          description: Subscription created; challenge verified. The initial response contains the one-time secret; an idempotent replay contains subscription metadata only. Records are replayable only while the configured idempotency retention window is active.
          headers:
            Cache-Control:
              description: Always no-store because the initial response contains a one-time secret.
              schema: {type: string, example: no-store}
            Idempotent-Replayed:
              description: Present with value true only when the response is an idempotent replay.
              schema: {type: string, enum: ["true"]}
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/CallbackCreateInitialEnvelope'}
                  - {$ref: '#/components/schemas/CallbackCreateReplayEnvelope'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/callback-subscriptions/{id}:
    delete:
      operationId: deleteCallbackSubscription
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200': {description: Subscription deleted.}
        '403': {$ref: '#/components/responses/Error'}
  /admin/callback-subscriptions/{id}/deliveries:
    get:
      operationId: listCallbackDeliveries
      description: Current local delivery metadata for an owned subscription in the verified tenant. Requires current Snaplink callback.manage; paused delivery or missing signing keys do not hide recovery reads. Metadata selection and a fresh redacted read fact commit together; audit failure returns no page. Never reads signed payloads, remote responses, endpoints, ciphertext or worker IDs. Descending UUID keysets are not a global snapshot or attempt history.
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: status, in: query, schema: {type: string, enum: [pending, delivering, success, dead_letter]}}
      responses:
        '200':
          description: Audited, bounded metadata page. Owner/tenant/subscription mismatch is not found, not a cross-tenant query.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CallbackDeliveryListEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /admin/callback-subscriptions/{id}/deliveries/{delivery_id}:
    get:
      operationId: getCallbackDelivery
      description: Audited current-row metadata only, with the same current authority and owner/tenant/subscription boundary as listing. A GET is not authorization to replay or proof of receiver effects; delivering/lease expiry can represent an unknown remote outcome.
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: delivery_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Audited delivery metadata; no content or one-time secret.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CallbackDeliveryEnvelope'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /admin/callback-subscriptions/deliveries/{id}/replay:
    post:
      operationId: replayCallbackDelivery
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/RequiredIdempotencyKey'}
      responses:
        '200':
          description: Delivery queued for manual replay. Retries with the same key and delivery ID replay the stored response without creating another replay audit fact; the guarantee lasts for the configured idempotency retention window.
          headers:
            Idempotent-Replayed:
              description: Present with value true when the response was replayed from the idempotency store.
              schema: {type: string, enum: ["true"]}
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: object, properties: {status: {type: string, example: queued}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/accounts:
    get:
      operationId: listAccounts
      security: [{snaplinkBearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: home_region, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Keyset-paginated account list (admin).
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/accounts/{id}:
    get:
      operationId: getAccount
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Canonical account view (admin).
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/accounts/backfill/legacy-identities:
    post:
      operationId: backfillLegacyIdentities
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: {type: integer, minimum: 1, maximum: 1000}
      responses:
        '200':
          description: Bounded shadow backfill result for legacy uids; the administrative batch intent is durably audited before account creation (P1-07).
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/accounts/{id}/overview:
    get:
      operationId: getAccountOverview
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/Dataset'}
        - {$ref: '#/components/parameters/Consistency'}
        - {$ref: '#/components/parameters/MaxAge'}
      responses:
        '200':
          description: Account aggregate overview (admin).
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/accounts/{id}/data:
    get:
      operationId: getAccountData
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/Dataset'}
        - {$ref: '#/components/parameters/Consistency'}
        - {$ref: '#/components/parameters/MaxAge'}
      responses:
        '200':
          description: Account aggregate data (admin).
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/accounts/{id}/sync:
    post:
      operationId: syncAccount
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '201':
          description: Sync job created for the account.
          content: {application/json: {schema: {$ref: '#/components/schemas/SyncJobEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/accounts/{id}/export:
    post:
      operationId: exportAccount
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '201':
          description: Export job created for the account.
          content: {application/json: {schema: {$ref: '#/components/schemas/SyncJobEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/accounts/{id}/erase:
    post:
      operationId: eraseAccount
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '202': {description: Erase saga accepted; track via /sync/jobs.}
        '403': {$ref: '#/components/responses/Error'}
  /admin/migration/legacy/compare:
    post:
      operationId: compareLegacyMigration
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [owner_uid, source]
              properties:
                owner_uid: {type: string}
                source: {type: string, enum: [aero-vault, aero-im]}
                limit: {type: integer, minimum: 1, maximum: 5000}
      responses:
        '200':
          description: Redacted shadow migration comparison result, released only after a durable sensitive-read audit fact (P8-02).
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/migration/legacy/cutover/{tenant_id}:
    get:
      operationId: getLegacyCutover
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantID'}
      responses:
        '200':
          description: Per-tenant legacy cutover status (P8-04).
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/migration/legacy/cutover:
    post:
      operationId: setLegacyCutover
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, status]
              properties:
                tenant_id: {type: string}
                status: {type: string, enum: [legacy, shadow, cut_over, rolled_back]}
                note: {type: string}
      responses:
        '200':
          description: Cutover decision and its audit fact atomically recorded with a server-side expected-status CAS (P8-04).
          content: {application/json: {schema: {type: object}}}
        '409':
          description: The transition is invalid or the observed cutover status changed concurrently; reload status before retrying.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/migration/legacy/cleanup-readiness/{tenant_id}:
    get:
      operationId: getCleanupReadiness
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantID'}
      responses:
        '200':
          description: Legacy cleanup readiness checklist (P8-05).
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/audit-log:
    get:
      operationId: listAdminAuditLog
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: action, in: query, schema: {type: string}}
      responses:
        '200':
          description: Admin audit log entries.
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/roles:
    get:
      operationId: listRoles
      security: [{snaplinkBearer: []}]
      responses:
        '200':
          description: Role catalog.
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/roles/{uid}:
    get:
      operationId: listUserRoles
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/UID'}
      responses:
        '200':
          description: Roles held by one user.
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/roles/grant:
    post:
      operationId: grantRole
      security: [{snaplinkBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [uid, role_code]
              properties:
                uid: {type: string}
                role_code: {type: string}
      responses:
        '200': {description: Role granted.}
        '403': {$ref: '#/components/responses/Error'}
  /admin/roles/revoke:
    post:
      operationId: revokeRole
      security: [{snaplinkBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [uid, role_code]
              properties:
                uid: {type: string}
                role_code: {type: string}
      responses:
        '200': {description: Role revoked.}
        '403': {$ref: '#/components/responses/Error'}
  /admin/bans:
    post:
      operationId: banUser
      security: [{snaplinkBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [uid, reason]
              properties:
                uid: {type: string}
                reason: {type: string}
                duration: {type: string, example: 24h}
      responses:
        '200': {description: User banned.}
        '403': {$ref: '#/components/responses/Error'}
    get:
      operationId: listBanned
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Active bans, cursor-paged.
          content: {application/json: {schema: {type: object}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/bans/{uid}:
    delete:
      operationId: unbanUser
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/UID'}
      responses:
        '200': {description: Ban lifted.}
        '403': {$ref: '#/components/responses/Error'}
  /audit/replays/{id}:
    get:
      operationId: getAuditReplay
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Controlled replay operation timeline; forensic and dry-run windows are returned synchronously and are not persisted as operations.
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/audit/holds:
    get:
      operationId: listLegalHolds
      security: [{snaplinkBearer: []}]
      responses:
        '200':
          description: Active legal holds visible to this tenant query (P4-07). The data object always contains a holds object array, including empty results; an empty query is not a global absence or cleanup authorization.
          content: {application/json: {schema: {$ref: '#/components/schemas/HoldListEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: putLegalHold
      security: [{snaplinkBearer: []}]
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HoldRequest'}
      responses:
        '201': {description: Legal hold recorded.}
        '403': {$ref: '#/components/responses/Error'}
  /admin/audit/holds/{scope_type}/{scope_id}:
    delete:
      operationId: removeLegalHold
      security: [{snaplinkBearer: []}]
      parameters:
        - {name: scope_type, in: path, required: true, schema: {type: string, enum: [tenant, account, actor]}}
        - {name: scope_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Legal hold lifted.}
        '403': {$ref: '#/components/responses/Error'}
  /admin/audit/anchor:
    post:
      operationId: anchorAuditChains
      description: Requires the system.config permission because the operation writes immutable objects for every audit chain.
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: WORM anchor pass over all audit chains after a durable, fail-closed administrative intent audit (P4-03).
          content: {application/json: {schema: {$ref: '#/components/schemas/AnchorRunEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/audit/anchor/manifest/{source}/{partition}:
    get:
      operationId: getAuditAnchor
      security: [{snaplinkBearer: []}]
      parameters:
        - {name: source, in: path, required: true, schema: {type: string}}
        - {name: partition, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Newest stored anchor for the exact requested source and partition; a successful sensitive read is durably audited before return. Target matching is not complete evidence or signature verification.
          content: {application/json: {schema: {$ref: '#/components/schemas/AnchorManifestEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
  /admin/regions/promote:
    post:
      operationId: promoteHomeRegion
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [account_id, target_region]
              properties:
                account_id: {type: string, format: uuid}
                target_region: {type: string}
                expected_epoch: {type: integer, minimum: 0}
      responses:
        '200':
          description: Fencing-epoch CAS promotion result.
          headers:
            X-Aero-Write-Epoch:
              description: The promoted target writer and its new fencing epoch.
              schema: {type: string, example: 'eu-west:8'}
          content: {application/json: {schema: {$ref: '#/components/schemas/PromoteResultEnvelope'}}}
        '409': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/regions/directory/{account_id}:
    get:
      operationId: getRegionDirectory
      security: [{snaplinkBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AccountID'}
      responses:
        '200':
          description: Durable home-region directory entry with fencing epoch.
          content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryEnvelope'}}}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    snaplinkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Snaplink access token. Aero ID never issues or stores tokens and locally
        validates signature, exact issuer/audience, expiration, subject, and a
        non-empty tenant claim before creating request context.
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Dataset: {name: dataset, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
    Consistency: {name: consistency, in: query, schema: {type: string, enum: [eventual, bounded, strong], default: eventual}}
    MaxAge: {name: max_age, in: query, schema: {type: string, example: 5m}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 200}}
    RequiredIdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}, description: Stable per command retry key. Reuse it only for the same concrete resource and request; retention is bounded by server configuration.}
    WorkerID: {name: X-Worker-ID, in: header, schema: {type: string, maxLength: 128}}
    AccountID: {name: account_id, in: path, required: true, schema: {type: string, format: uuid}}
    TenantID: {name: tenant_id, in: path, required: true, schema: {type: string}}
    UID: {name: uid, in: path, required: true, schema: {type: string}}
  responses:
    CommandIntent:
      description: Server-owned preview/execution receipt; Cache-Control no-store.
      content: {application/json: {schema: {$ref: '#/components/schemas/CommandIntentEnvelope'}}}
    Error:
      description: Stable application error.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    DatasetList:
      description: Allow-listed datasets.
      content: {application/json: {schema: {$ref: '#/components/schemas/DatasetList'}}}
    AccountView:
      description: Canonical account and aero-id-owned profile.
      content: {application/json: {schema: {$ref: '#/components/schemas/AccountView'}}}
    Profile:
      description: Aero-id-owned presentation fields only.
      content: {application/json: {schema: {$ref: '#/components/schemas/ProfileEnvelope'}}}
    Aggregate:
      description: Eventual or bounded-stale aggregate with per-source freshness.
      content: {application/json: {schema: {$ref: '#/components/schemas/AggregateEnvelope'}}}
    SyncJob:
      description: Durable asynchronous job.
      content: {application/json: {schema: {$ref: '#/components/schemas/SyncJobEnvelope'}}}
    SyncJobList:
      description: Keyset-paginated asynchronous jobs.
      content: {application/json: {schema: {$ref: '#/components/schemas/SyncJobListEnvelope'}}}
    Operation:
      description: Durable cross-source operation.
      content: {application/json: {schema: {$ref: '#/components/schemas/OperationEnvelope'}}}
    OperationList:
      description: Keyset-paginated operation list.
      content: {application/json: {schema: {$ref: '#/components/schemas/OperationListEnvelope'}}}
  schemas:
    CommandIntentRequest:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        account_id: {type: string, format: uuid}
        plan: {$ref: '#/components/schemas/CommandPlan'}
    CommandPlan:
      type: object
      additionalProperties: false
      required: [kind, datasets]
      properties:
        kind: {type: string, enum: [sync, export, erase, operation, callback_replay]}
        datasets: {type: array, maxItems: 11, uniqueItems: true, items: {type: string}}
        operation_type: {type: string, enum: [sync, erase, source.command, replay]}
        request_payload: {type: object}
        callback:
          type: object
          additionalProperties: false
          required: [subscription_id, delivery_id, event_id, revision, lease_generation]
          description: callback_replay only; datasets must be empty. Original owned dead-letter target, not proof of no receiver effects.
          properties:
            subscription_id: {type: string, format: uuid}
            delivery_id: {type: string, format: uuid}
            event_id: {type: string, format: uuid}
            revision: {type: integer, format: int64, minimum: 1}
            lease_generation: {type: integer, format: int64, minimum: 0}
        steps:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [step_key, source, action]
            properties:
              step_key: {type: string, minLength: 1, maxLength: 128}
              source: {type: string, enum: [snaplink, aero-im, aero-vault]}
              action: {type: string, enum: [sync, summary, source.summary, erase, delete, source.erase]}
              compensation_action: {type: string, enum: [sync, summary, source.summary, erase, delete, source.erase]}
              request_payload: {type: object}
    CommandIntentLookupEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [intent, key_digest]
          properties:
            intent: {$ref: '#/components/schemas/CommandIntent'}
            key_digest: {type: string, pattern: '^v1:[0-9a-f]{64}$'}
    CommandIntentEnvelope:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/CommandIntent'}}
    CommandIntent:
      type: object
      required: [intent_id, schema_version, account_id, tenant_id, client_id, issuer, version, status, plan,
        preconditions, confirmation_digest, destructive, authorization_version, resource_authorization, created_at, expires_at]
      properties:
        intent_id: {type: string, format: uuid}
        schema_version: {type: integer, const: 1}
        account_id: {type: string, format: uuid}
        tenant_id: {type: string}
        client_id: {type: string}
        issuer: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [prepared, executed, abandoned]}
        plan: {$ref: '#/components/schemas/CommandPlan'}
        preconditions:
          type: object
          description: Local metadata only; captured absence is not source deletion authority.
          required: [account_status, home_region, writer_epoch, resolver_version, snapshots]
          properties:
            account_status: {type: string, enum: [active, suspended, erased]}
            home_region: {type: string}
            writer_epoch: {type: integer, format: int64, minimum: 0}
            resolver_version: {type: string}
            snapshots: {type: array, maxItems: 11, items: {type: object}}
        confirmation_digest: {type: string, pattern: '^v1:[0-9a-f]{64}$'}
        destructive: {type: boolean}
        authorization_version: {type: string, enum: [unsupported]}
        resource_authorization: {type: string, enum: [unknown]}
        receipt_kind: {type: string, enum: [sync_job, operation, callback_replay], description: 'callback_replay uses receipt_id equal to intent_id; proves only atomic local queuing.'}
        receipt_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        abandoned_at: {type: string, format: date-time, description: Database-clock closure time; required only for abandoned version 2 without any execution receipt.}
    CapabilityEnvelope:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/CapabilityReport'}}
    AccessState: {type: string, enum: [allowed, denied, unknown]}
    Capability:
      type: object
      additionalProperties: false
      required: [name, registered, enabled, authorization, authorization_scope, available]
      properties:
        name: {type: string}
        registered: {type: boolean}
        enabled: {type: boolean}
        authorization: {$ref: '#/components/schemas/AccessState'}
        authorization_scope: {type: string, enum: [self, global]}
        available: {type: boolean}
        reason_code: {type: string}
    DatasetCapability:
      type: object
      additionalProperties: false
      required: [name, source, pii, registered, enabled, authorization, resource_authorization, status, fresh, version]
      properties:
        name: {type: string}
        source: {type: string, enum: [snaplink, aero-im, aero-vault]}
        pii: {type: boolean}
        registered: {type: boolean}
        enabled: {type: boolean}
        authorization: {$ref: '#/components/schemas/AccessState'}
        resource_authorization: {type: string, enum: [unknown], description: Always rechecked at the source; never inferred from this report.}
        status: {type: string, enum: [fresh, stale, unavailable, unknown]}
        fresh: {type: boolean}
        version: {type: integer, format: int64}
        generated_at: {type: string, format: date-time}
        last_synced_at: {type: string, format: date-time}
        reason_code: {type: string}
    CapabilityReport:
      type: object
      additionalProperties: false
      required: [schema_version, account_id, tenant_id, client_id, issuer, home_region, local_region, generated_at, authorization_version, partial, capabilities, datasets]
      properties:
        schema_version: {type: integer, const: 1}
        account_id: {type: string, format: uuid}
        tenant_id: {type: string}
        client_id: {type: string}
        issuer: {type: string}
        home_region: {type: string}
        local_region: {type: string}
        generated_at: {type: string, format: date-time}
        authorization_version: {type: string, enum: [unsupported]}
        partial: {type: boolean}
        capabilities: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Capability'}}
        datasets: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/DatasetCapability'}}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    DatasetList:
      type: object
      properties:
        data:
          type: object
          properties:
            datasets:
              type: array
              items:
                type: object
                required: [name, source, pii]
                properties: {name: {type: string}, source: {type: string}, pii: {type: boolean}}
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string}
        avatar_url: {type: string}
        locale: {type: string}
        timezone: {type: string}
        preferences: {type: object}
    ProfileEnvelope:
      type: object
      properties: {data: {$ref: '#/components/schemas/Profile'}}
    Profile:
      type: object
      description: >-
        The four root text fields are always present, including when empty.
        They do not convey current authorization or a Profile version for CAS.
      required: [display_name, avatar_url, locale, timezone]
      properties:
        account_id: {type: string, format: uuid}
        display_name: {type: string}
        avatar_url: {type: string}
        locale: {type: string}
        timezone: {type: string}
        preferences: {type: object}
    AccountView:
      type: object
      properties:
        data:
          type: object
          properties:
            account: {type: object}
            profile: {$ref: '#/components/schemas/Profile'}
            sources: {type: array, items: {type: object}}
            memberships: {type: array, items: {type: object}}
    AggregateEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            account: {type: object}
            profile: {$ref: '#/components/schemas/Profile'}
            snapshots: {type: array, items: {type: object}}
            consistency: {type: string}
            partial: {type: boolean}
            source_errors: {type: object, additionalProperties: {type: string}}
            stale_datasets: {type: array, items: {type: string}}
    JobRequest:
      type: object
      properties:
        datasets: {type: array, items: {type: string}}
        idempotency_key: {type: string, maxLength: 200}
    SyncJobEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [job_id, status]
          properties:
            job_id: {type: string, format: uuid, description: Canonical root Sync Job ID; id and operation_id are not substitutes.}
            status:
              type: string
              enum: [pending, running, completed, partially_completed, failed, unknown]
              description: Exact Sync Job status string; not a remote completion proof or a grant to retry.
    SyncJobListEnvelope:
      type: object
      description: Local task page; empty lists are arrays, and an empty or absent next_cursor ends this query.
      required: [data]
      properties:
        data:
          type: object
          required: [jobs]
          properties:
            jobs: {type: array, items: {type: object}}
            next_cursor: {type: string}
    OperationRequest:
      type: object
      required: [operation_type, steps]
      properties:
        account_id: {type: string, format: uuid}
        operation_type: {type: string}
        idempotency_key: {type: string, maxLength: 200}
        request_payload: {type: object}
        steps:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/OperationStepRequest'}
    OperationStepRequest:
      type: object
      additionalProperties: true
      required: [step_key, source, action]
      properties:
        step_key: {type: string, maxLength: 128}
        source: {type: string, enum: [snaplink, aero-im, aero-vault]}
        action: {type: string}
        compensation_action: {type: string}
        request_payload:
          type: object
          additionalProperties: true
          description: >-
            For Aero IM summary/sync and erase/delete actions, datasets is
            required, non-empty, unique, and exact (no trimming or rewriting).
            Valid Aero IM values are aero-im.profile, aero-im.workspaces,
            aero-im.activity_summary, and aero-im.notifications. Destructive
            erase/delete actions for other sources also require registered,
            same-source datasets; non-destructive legacy payloads retain their
            compatibility rules.
          properties:
            datasets:
              type: array
              items: {type: string}
              description: >-
                Conditional Aero IM allow-list: aero-im.profile,
                aero-im.workspaces, aero-im.activity_summary, or
                aero-im.notifications.
    OperationStepScope:
      type: object
      additionalProperties: false
      required: [status, datasets]
      description: >-
        Read-only projection of this step's explicit stored scope, shared by its
        forward and compensation actions. No arbitrary request_payload is returned.
        Missing scope is never expanded or inferred from root requests, results or
        audit. Invalid scope exposes no names. This is not an authorization grant,
        source capability, resource ACL, or proof of execution.
      properties:
        status: {type: string, enum: [explicit, missing, invalid]}
        datasets:
          type: array
          maxItems: 11
          uniqueItems: true
          description: Non-empty registered same-source names only when status is explicit; otherwise an empty array. Preserves stored order.
          items:
            type: string
            enum: [snaplink.identity, snaplink.tenants, snaplink.permissions, snaplink.security, aero-im.profile, aero-im.workspaces, aero-im.activity_summary, aero-im.notifications, aero-vault.tenants, aero-vault.buckets, aero-vault.usage]
      oneOf:
        - properties:
            status: {enum: [explicit]}
            datasets: {minItems: 1}
        - properties:
            status: {enum: [missing, invalid]}
            datasets: {maxItems: 0}
    OperationStepView:
      type: object
      required: [id, step_key, source, action, dataset_scope, status, attempt, result]
      description: Latest bounded step record, not attempt history. Step timestamps and arbitrary request_payload are not exposed by HTTP.
      properties:
        id: {type: string, format: uuid}
        step_key: {type: string}
        source: {type: string}
        action: {type: string}
        dataset_scope: {$ref: '#/components/schemas/OperationStepScope'}
        status: {type: string}
        attempt: {type: integer}
        source_operation_id: {type: string}
        result: {type: object, nullable: true}
        compensation_action: {type: string}
        compensation_status: {type: string}
        compensation_attempt: {type: integer}
        compensation_source_operation_id: {type: string}
        compensation_result: {type: object, nullable: true}
    OperationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [operation_id, status, steps]
          properties:
            operation_id: {type: string, format: uuid, description: Canonical root Operation ID; id and job_id are not substitutes.}
            status:
              type: string
              enum: [requested, running, waiting, unknown, partially_completed, completed, failed, compensating]
              description: Exact Operation status string; not a remote completion proof or a grant to retry.
            steps:
              type: array
              maxItems: 32
              items: {$ref: '#/components/schemas/OperationStepView'}
    OperationListEnvelope:
      type: object
      description: Local task page; empty lists are arrays, and an empty or absent next_cursor ends this query.
      required: [data]
      properties:
        data:
          type: object
          required: [operations]
          properties:
            operations:
              type: array
              items:
                type: object
                properties:
                  steps:
                    type: array
                    maxItems: 32
                    items: {$ref: '#/components/schemas/OperationStepView'}
            next_cursor: {type: string}
    SourceReference:
      type: object
      description: Saved source-native reference, not a source ACL, current health, global grant or completeness proof. Opaque scope IDs are not interchangeable with the caller tenant.
      required: [id, source, source_region, source_account_id, status, version]
      properties:
        id: {type: string, format: uuid}
        source: {type: string}
        source_region: {type: string}
        source_account_id: {type: string}
        scope_type: {type: string, description: Source-native type; omitted does not imply global scope.}
        scope_id: {type: string}
        status: {type: string, description: Saved reference state, not current resource authorization or freshness.}
        version: {type: integer, format: int64}
        generated_at: {type: string, format: date-time, nullable: true}
        last_synced_at: {type: string, format: date-time, nullable: true}
        error_code: {type: string}
        data: {type: object, description: Approved source extensions; Web reference views do not expand this object.}
    MembershipReference:
      type: object
      description: Saved membership keyed by source and native scope. Role including owner is not a global permission or source resource ACL.
      required: [id, source, source_region, scope_type, scope_id, source_member_id, role, status, version]
      properties:
        id: {type: string, format: uuid}
        source: {type: string}
        source_region: {type: string}
        scope_type: {type: string}
        scope_id: {type: string}
        source_member_id: {type: string}
        role: {type: string}
        status: {type: string}
        version: {type: integer, format: int64}
        last_synced_at: {type: string, format: date-time, nullable: true}
        data: {type: object, description: Approved source extensions; not a mutable ACL copy.}
    SourceListEnvelope:
      type: object
      description: Current caller's local keyset page; no coverage/complete, total or freshness budget. Empty results do not establish that no source account exists.
      required: [data]
      properties:
        data:
          type: object
          required: [sources]
          properties:
            sources: {type: array, items: {$ref: '#/components/schemas/SourceReference'}}
            next_cursor: {type: string}
    MembershipListEnvelope:
      type: object
      description: Current caller's local keyset page, not all memberships or a global authorization grant.
      required: [data]
      properties:
        data:
          type: object
          required: [memberships]
          properties:
            memberships: {type: array, items: {$ref: '#/components/schemas/MembershipReference'}}
            next_cursor: {type: string}
    ActivityEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            events: {type: array, items: {type: object}}
            next_cursor: {type: string}
            partial: {type: boolean}
            generated_at: {type: string, format: date-time}
            source_errors: {type: object, additionalProperties: {type: string}}
            stale_datasets: {type: array, items: {type: string}}
    ReplayRequest:
      type: object
      properties:
        mode: {type: string, enum: [forensic, dry-run, controlled]}
        account_id: {type: string, format: uuid}
        operation_id: {type: string, format: uuid, description: Optional historical operation scope; controlled replay requires it to belong to account_id and records it only as provenance.}
        from: {type: string, format: date-time, description: Inclusive lower bound for forensic or dry-run facts; forbidden for controlled replay.}
        to: {type: string, format: date-time, description: Exclusive upper bound for forensic or dry-run facts; must be later than from and is forbidden for controlled replay.}
        cursor: {type: string, maxLength: 512, description: Opaque next_cursor from the previous forensic or dry-run window; forbidden for controlled replay.}
        limit: {type: integer, minimum: 1, maximum: 100}
        idempotency_key: {type: string, maxLength: 200}
        confirmed: {type: boolean}
        commands: {type: array, items: {type: object}}
    ReplayEnvelope:
      type: object
      properties:
        data:
          type: object
          required: [replay_id, mode, status]
          properties:
            replay_id: {type: string, format: uuid}
            mode: {type: string, enum: [forensic, dry-run, controlled]}
            status: {type: string}
            events: {type: array, items: {type: object}}
            next_cursor: {type: string, description: Opaque continuation cursor for forensic or dry-run only.}
            simulation: {type: object, additionalProperties: true}
            operation: {type: object, additionalProperties: true}
    ProjectionReplayEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            account_id: {type: string, format: uuid}
            source: {type: string}
            replayed_events: {type: integer}
            completed: {type: boolean}
            next_cursor: {type: string}
            matched: {type: array, items: {type: object}}
            divergent: {type: array, items: {type: object}}
            shadow_only: {type: array, items: {type: object}}
            live_only: {type: array, items: {type: object}}
    HoldRequest:
      type: object
      required: [scope_type, scope_id]
      properties:
        scope_type: {type: string, enum: [tenant, account, actor]}
        scope_id: {type: string}
        reason: {type: string}
        expires_at: {type: string, format: date-time}
    HoldListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [holds]
          properties:
            holds: {type: array, items: {type: object}}
    AnchorManifestEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [source, partition]
          description: Stored anchor document; these root strings match the original path parameters. Other archive fields are preserved; target matching alone does not verify evidence completeness, hashes or signatures.
          properties:
            source: {type: string}
            partition: {type: string}
    AnchorRunEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            anchored: {type: integer}
            chains: {type: array, items: {type: object}}
    CallbackCreateRequest:
      type: object
      required: [endpoint, event_types]
      properties:
        endpoint: {type: string, format: uri}
        event_types: {type: array, items: {type: string}}
        tenant_id: {type: string}
    CallbackCreateInitialEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subscription, secret]
          properties:
            subscription: {$ref: '#/components/schemas/CallbackSubscription'}
            secret: {type: string, description: One-time callback verification secret; never returned by replay.}
    CallbackCreateReplayEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subscription]
          properties:
            subscription: {$ref: '#/components/schemas/CallbackSubscription'}
    CallbackSubscription:
      type: object
      required: [id, owner_uid, endpoint, event_types, enabled, verified]
      properties:
        id: {type: string, format: uuid}
        owner_uid: {type: string}
        tenant_id: {type: string}
        endpoint: {type: string, format: uri}
        event_types: {type: array, items: {type: string}}
        enabled: {type: boolean}
        verified: {type: boolean}
    CallbackListEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            subscriptions: {type: array, items: {type: object}}
            next_cursor: {type: string}
    CallbackDeliveryMetadata:
      type: object
      additionalProperties: false
      required: [id, subscription_id, event_id, tenant_id, action, status, attempt, revision, lease_generation, next_attempt_at, status_code, error_code, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        tenant_id: {type: string}
        action: {type: string, maxLength: 128}
        status: {type: string, enum: [pending, delivering, success, dead_letter, unknown]}
        attempt: {type: integer, minimum: 0}
        revision: {type: integer, format: int64, minimum: 1, description: Local all-writer CAS revision, not a causal watermark.}
        lease_generation: {type: integer, format: int64, minimum: 0, description: Local claim generation paired with revision only in version-bound replay; not a policy version.}
        lease_until: {type: string, format: date-time}
        next_attempt_at: {type: string, format: date-time}
        status_code: {type: integer, minimum: 0, maximum: 599, description: Zero means no recorded HTTP response. A 2xx response is not proof of business effects at the receiver.}
        error_code: {type: string, enum: ['', callback.delivery_failed, callback.secret_unavailable, manual_replay, callback.error_unknown]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CallbackDeliveryListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [deliveries, next_cursor]
          properties:
            deliveries: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CallbackDeliveryMetadata'}}
            next_cursor: {type: string, description: Last emitted UUID when another bounded page exists; empty on completion.}
    CallbackDeliveryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [delivery]
          properties:
            delivery: {$ref: '#/components/schemas/CallbackDeliveryMetadata'}
    AuditExportRequest:
      type: object
      properties:
        continuation_job_id: {type: string, format: uuid, description: Resume the next bounded window from a completed audit export job in the same tenant and account.}
    AuditExportEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [job_id]
          properties:
            job_id: {type: string, format: uuid}
            status: {type: string}
            download_url: {type: string}
    PromoteResultEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            account_id: {type: string, format: uuid}
            target_region: {type: string}
            fenced_epoch: {type: integer}
    DirectoryEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            account_id: {type: string, format: uuid}
            home_region: {type: string}
            resolver_version: {type: string}
            fenced_epoch: {type: integer}
            promoted_at: {type: string, format: date-time}
    OperationAuditEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [operation_id, events]
          properties:
            operation_id:
              type: string
              format: uuid
              description: Exact requested Operation ID; response correlation is not an authorization grant.
            events:
              type: array
              items: {type: object}
              description: Redacted local audit facts; an empty array is a successful empty query, not an unavailable response.
            next_cursor:
              type: string
              description: Opaque keyset cursor, returned unchanged to read the next page; empty means this query has no next page, not complete history.
    AuditList:
      type: object
      properties:
        data:
          type: object
          properties:
            events: {type: array, items: {type: object}}
            next_cursor: {type: string}
