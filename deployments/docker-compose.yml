# Local integration stack. All credential values are supplied by the caller;
# keep them in an untracked .env file or a secret manager, never in this file.
# Snaplink is an external prerequisite; this stack never invents a login authority.
x-aero-runtime: &aero-runtime
  build:
    context: ..
    dockerfile: deployments/Dockerfile
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    AERO_ID_DATABASE_HOST: postgres
    AERO_ID_DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    AERO_ID_SIGNING_KEY: "${AERO_ID_SIGNING_KEY:?Set AERO_ID_SIGNING_KEY}"
    AERO_ID_AUDIT_LEDGER_SIGNING_KEY: "${AERO_ID_AUDIT_LEDGER_SIGNING_KEY:?Set AERO_ID_AUDIT_LEDGER_SIGNING_KEY}"
    AERO_ID_SSO_ENDPOINT: "${AERO_ID_SSO_ENDPOINT:?Set the Snaplink gRPC endpoint}"
    AERO_ID_SSO_JWKS_URL: "${AERO_ID_SSO_JWKS_URL:?Set the reachable Snaplink JWKS URL}"
    AERO_ID_SSO_ISSUER: "${AERO_ID_SSO_ISSUER:?Set the exact JWT issuer}"
    AERO_ID_SSO_AUDIENCE: "${AERO_ID_SSO_AUDIENCE:?Set the aero-id API token audience}"
    AERO_ID_ACCOUNT_ISSUER: "${AERO_ID_SSO_ISSUER:?Set the exact JWT issuer}"
    AERO_ID_SSO_AUTHZ_CLIENT_ID: "${AERO_ID_SSO_AUTHZ_CLIENT_ID:?Set the registered Snaplink AuthZ client}"
    AERO_ID_SSO_AUTHZ_REQUIRED: "true"
    AERO_ID_SSO_AUTHZ_LEGACY_FALLBACK: "false"
    AERO_ID_SSO_INSECURE: "${AERO_ID_SSO_INSECURE:-false}"
    AERO_ID_SERVER_HTTP_CORS_ORIGINS: "${AERO_ID_SERVER_HTTP_CORS_ORIGINS:-http://localhost:5180}"
    AERO_ID_EXPORT_ENCRYPTION_KEY: "${AERO_ID_EXPORT_ENCRYPTION_KEY:-}"
    AERO_ID_CALLBACK_MASTER_KEY: "${AERO_ID_CALLBACK_MASTER_KEY:-}"
    AERO_ID_STORAGE_TYPE: s3
    AERO_ID_STORAGE_S3_ENDPOINT: http://minio:9000
    AERO_ID_STORAGE_S3_REGION: us-east-1
    AERO_ID_STORAGE_S3_BUCKET: aero-id-files
    AERO_ID_STORAGE_S3_ACCESS_KEY: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
    AERO_ID_STORAGE_S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
    AERO_ID_STORAGE_S3_USE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aero
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: aero_id
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aero_id"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    <<: *aero-runtime
    depends_on:
      postgres:
        condition: service_healthy
    # Use the shipped runner: golang-migrate's single-row bookkeeping is not
    # compatible with aero-id's per-version/checksum/advisory-lock contract.
    entrypoint: ["/app/migrate"]
    command: ["-config", "/app/configs/config.yaml", "-migrations", "/app/migrations", "up"]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}"
        "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/aero-id-files

  aero-id:
    <<: *aero-runtime
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports: ["8080:8080", "9090:9090"]

volumes:
  pgdata:
  miniodata:
