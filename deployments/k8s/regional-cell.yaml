            - name: AERO_ID_SOURCES_SNAPLINK_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: snaplink_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_SNAPLINK_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: snaplink_oauth_client_secret, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_oauth_client_secret, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_TARGET_ASSERTION_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_target_assertion_private_key, optional: true}
            - name: AERO_ID_SOURCES_AERO_VAULT_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_vault_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_AERO_VAULT_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_vault_oauth_client_secret, optional: true}
            - name: AERO_ID_REPLICATION_HTTP_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: replication_http_bearer_token, optional: true}
          volumeMounts:
            - name: config
              mountPath: /etc/aero-id
              readOnly: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: aero-id-config
            defaultMode: 0444
---
# Regional PostgreSQL (single writer). Multi-writer requires an ADR + conflict
# model; default is home-region writes + async projection replication (P6-03).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aero-id-postgres
  namespace: aero-id
spec:
  serviceName: aero-id-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aero-id-postgres
  template:
    metadata:
      labels:
        app: aero-id-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          imagePullPolicy: Always
          env:
            - name: POSTGRES_DB
              value: aero_id
            - name: POSTGRES_USER
              value: aero
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: database_password}
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aero-id-postgres
  namespace: aero-id
spec:
  selector:
    app: aero-id-postgres
  ports:
    - port: 5432
      targetPort: pg
---
# Regional Redis: cache/rate-limit/lease coordination only; correctness state
# lives in PostgreSQL (ADR-008).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aero-id-redis
  namespace: aero-id
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aero-id-redis
  template:
    metadata:
      labels:
        app: aero-id-redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          imagePullPolicy: Always
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: redis_password}
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: aero-id-redis
  namespace: aero-id
spec:
  selector:
    app: aero-id-redis
  ports:
    - port: 6379
      targetPort: redis
---
# Regional NATS JetStream: canonical event transport (P3-04/P6-03).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aero-id-nats
  namespace: aero-id
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aero-id-nats
  template:
    metadata:
      labels:
        app: aero-id-nats
    spec:
      containers:
        - name: nats
          image: docker.io/library/nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881acbdc70fcb6bb927
          imagePullPolicy: Always
          args: ["-js", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: aero-id-nats
  namespace: aero-id
spec:
  selector:
    app: aero-id-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aero-id
  namespace: aero-id
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: nginx
  rules:
    - host: api.REGION_PLACEHOLDER.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aero-id
                port:
                  name: http
