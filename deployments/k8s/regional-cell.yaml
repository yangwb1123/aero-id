            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          args: ["-config", "/etc/aero-id/config.yaml"]
          env:
            - name: AERO_ID_CONFIG_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['checksum/config']
            - name: AERO_ID_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: database_password}
            - name: AERO_ID_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: redis_password}
            - name: AERO_ID_CALLBACK_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: callback_master_key}
            - name: AERO_ID_EVENT_INGEST_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: event_ingest_signing_key}
            - name: AERO_ID_AUDIT_LEDGER_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: audit_ledger_signing_key}
