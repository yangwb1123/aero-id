# Regional cell deployment (P6-01). Each region deploys its own cell: stateless
# API/worker workloads, regional PostgreSQL, Redis, and the event bus. Account
# writes route to the account's home region; read replicas serve local projections.
apiVersion: v1
kind: Namespace
metadata:
  name: aero-id
  labels:
    aero.io/cell: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aero-id-config
  namespace: aero-id
data:
  config.yaml: |
    app:
      name: aero-id
      env: production
      version: "1.0.0"
    server:
      http:
        host: 0.0.0.0
        port: 8080
        cors_origins:
          - https://accounts.example.com
        read_timeout: 15s
        read_header_timeout: 10s
        write_timeout: 15s
        shutdown_timeout: 15s
        idempotency_ttl: 24h
        request_timeout: 30s
        legacy_sunset: "2027-06-30"
      grpc:
        host: 0.0.0.0
        port: 9090
    account:
      issuer: https://snaplink.example.com
      region: "REGION_PLACEHOLDER"        # set per cell, e.g. us-east-1
      home_region_version: "v1"
      regions: ["us-east-1", "eu-west-1", "ap-southeast-1"]
    sources:
      snaplink:
        # Sources are disabled in the base cell. A secure, environment-specific
        # overlay must set the endpoint and one complete source-auth mode.
        endpoint: ""
        allow_insecure_loopback: false
        summary_path: /internal/account-summary
        erase_path: ""                     # enable only after the source contract is deployed
        status_path: ""
        capabilities:
          summary: false
          erase: false
          operation_status: false
          erase_contract_version: ""
        region: "REGION_PLACEHOLDER"
        bearer_token: ""
        oauth_token_url: ""
        oauth_client_id: ""
        oauth_client_secret: ""
        oauth_scope: ""
        oauth_resource: ""
        oauth_allowed_hosts: []
        oauth_tls_ca_file: ""
        oauth_tls_cert_file: ""
        oauth_tls_key_file: ""
        oauth_tls_server_name: ""
        oauth_tenant_id: ""
        tls_ca_file: ""
        tls_cert_file: ""
        tls_key_file: ""
        tls_server_name: ""
        timeout: 2s
        max_body_bytes: 1048576
        max_concurrency: 32
        query_max_concurrency: 0            # 0 = partitioned max_concurrency fallback
        command_max_concurrency: 0          # reserved command capacity
        health_max_concurrency: 0           # reserved probe capacity
        max_attempts: 3
        retry_backoff: 50ms
      aero_im:
        # Disabled in the base cell until the OAuth + target-assertion trust
        # contract is supplied by a secure overlay.
        endpoint: ""
        allow_insecure_loopback: false
        summary_path: /internal/account-summary
        erase_path: ""
        status_path: ""
        region: "REGION_PLACEHOLDER"
        bearer_token: ""                    # compatibility only; prefer OAuth below
        # These blank keys are deliberately present so Viper can apply the
        # AERO_ID_SOURCES_AERO_IM_* overrides. The client secret must remain
        # blank here and is injected from aero-id-secrets below.
        oauth_token_url: ""
        oauth_client_id: ""
        oauth_client_secret: ""
        oauth_scope: ""
        oauth_resource: ""
        oauth_allowed_hosts: []             # set to the exact token-authority host in the production overlay
        oauth_tls_ca_file: ""
        oauth_tls_cert_file: ""
        oauth_tls_key_file: ""
        oauth_tls_server_name: ""
        oauth_tenant_id: ""
        tls_ca_file: ""
        tls_cert_file: ""
        tls_key_file: ""
        tls_server_name: ""
        timeout: 2s
        max_body_bytes: 1048576
        max_concurrency: 32
        query_max_concurrency: 0            # 0 = partitioned max_concurrency fallback
        command_max_concurrency: 0          # reserved command capacity
        health_max_concurrency: 0           # reserved probe capacity
        max_attempts: 3
        retry_backoff: 50ms
        # Owner-approved EdDSA target binding. Keep every field disabled until
        # the external dedicated Aero IM JWKS and private-key secret are
        # deployed together; see deployments/k8s/README.md.
        target_assertion_key_file: ""
        target_assertion_key_env: ""
        target_assertion_jwks_url: ""
        target_assertion_trust_domain: ""
        target_assertion_key_id: ""
        target_assertion_issuer: ""
        target_assertion_audience: ""
        target_assertion_subject: ""
        target_assertion_client_id: ""
        target_assertion_lifetime: 0s
        # When enabled, set target_assertion_key_env to
        # AERO_ID_SOURCES_AERO_IM_TARGET_ASSERTION_PRIVATE_KEY,
        # target_assertion_audience to aero-im-account-summary,
        # target_assertion_subject to aero-id-sync, and configure OAuth scope
        # aero.account.summary.read with resource aero-im. Keep the key-file
        # field blank in this Kubernetes deployment.
      aero_vault:
        # Disabled in the base cell. Enable only in a secure overlay with one
        # authenticated source-credential mode configured below.
        endpoint: ""
        allow_insecure_loopback: false
        summary_path: /v1/internal/account-summary
        erase_path: ""
        status_path: ""
        capabilities:
          erase: false
          operation_status: false
        region: "REGION_PLACEHOLDER"
        bearer_token: ""
        oauth_token_url: ""
        oauth_client_id: ""
        oauth_client_secret: ""
        oauth_scope: ""
        oauth_resource: ""
        oauth_allowed_hosts: []
        oauth_tls_ca_file: ""
        oauth_tls_cert_file: ""
        oauth_tls_key_file: ""
        oauth_tls_server_name: ""
        oauth_tenant_id: ""
        tls_ca_file: ""
        tls_cert_file: ""
        tls_key_file: ""
        tls_server_name: ""
        timeout: 2s
        max_body_bytes: 1048576
        max_concurrency: 32
        query_max_concurrency: 0            # 0 = partitioned max_concurrency fallback
        command_max_concurrency: 0          # reserved command capacity
        health_max_concurrency: 0           # reserved probe capacity
        max_attempts: 3
        retry_backoff: 50ms
    database:
      host: aero-id-postgres
      port: 5432
      dbname: aero_id
      user: aero
      password: ""                       # injected through AERO_ID_DATABASE_PASSWORD
      sslmode: require
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime: 30m
      connect_timeout: 3s                 # bound startup dials; migrations remain explicit
      auto_migrate: false                 # production applies migrations via cmd/migrate
    sso:
      endpoint: snaplink-authz:9000       # replace with the regional Snaplink gRPC endpoint
      jwks_url: https://snaplink.example.com/.well-known/jwks.json
      issuer: https://snaplink.example.com
      audience: aero-id
      authz_client_id: aero-id
      authz_required: true
      authz_legacy_fallback: false
      timeout: 5s
      insecure: false
      readiness_critical: true
      max_attempts: 3
      retry_backoff: 50ms
      max_concurrent: 64
    redis:
      endpoint: aero-id-redis:6379
    event_bus:
      nats:
        enabled: true
        url: nats://aero-id-nats:4222
        stream: aero_events
        subject: aero.events.canonical
        dead_letter_subject: aero.events.canonical.dead-letter
        durable: aero-id-ingest
        max_redeliveries: 5
        ack_wait: 30s
    replication:
      enabled: false                      # enable per cell once cross-region links exist
      interval: 5s
      lease: 2m
      batch_size: 500
      transport: nats
      nats_subject: aero.events.canonical
      http_endpoint: ""                # transport=http: remote ingest URL
      http_key: ""                     # transport=http: HMAC key from secret provider
      http_bearer_token: ""             # transport=http: service identity token from secret provider
    callback:
      master_key: ""                       # injected through AERO_ID_CALLBACK_MASTER_KEY
      worker_interval: 1s
      worker_concurrency: 4
    storage:
      type: s3
      s3:
        endpoint: https://minio.REGION_PLACEHOLDER.example.com
        bucket: aero-id-files
        region: REGION_PLACEHOLDER
        use_path_style: false
      max_upload_bytes: 52428800
    event_ingest:
      signing_key: ""                       # injected through AERO_ID_EVENT_INGEST_SIGNING_KEY
      require_timestamp: true
      max_body_bytes: 1048576
      clock_skew: 5m
    audit_ledger:
      signing_key: ""                       # injected through AERO_ID_AUDIT_LEDGER_SIGNING_KEY
    export:
      encryption_key: ""                    # injected through AERO_ID_EXPORT_ENCRYPTION_KEY
    signing_key: ""                         # injected through AERO_ID_SIGNING_KEY
    tracing:
      enabled: true
      endpoint: otel-collector:4317
      sample_ratio: 0.1
# Secret `aero-id-secrets` is provisioned out of band by the approved secret
# provider. It must contain database_password, redis_password, signing_key,
# callback_master_key, event_ingest_signing_key, audit_ledger_signing_key and
# export_encryption_key; add replication_http_bearer_token when HTTP
# replication is enabled. When the bound Aero IM summary is enabled, also add
# aero_im_target_assertion_private_key and aero_im_oauth_client_secret; the
# latter is exposed only as AERO_ID_SOURCES_AERO_IM_OAUTH_CLIENT_SECRET. No
# secret values belong in this manifest.
---
apiVersion: v1
kind: Service
metadata:
  name: aero-id
  namespace: aero-id
spec:
  selector:
    app: aero-id
    tier: api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aero-id-api
  namespace: aero-id
spec:
  replicas: 3
  revisionHistoryLimit: 10                 # retain a known-good template for rollback
  progressDeadlineSeconds: 900
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: aero-id
      tier: api
  template:
    metadata:
      labels:
        app: aero-id
        tier: api
      annotations:
        # The release renderer replaces this with SHA-256(config.yaml).
        # A config change must produce a new pod template.
        checksum/config: "REPLACE_WITH_CONFIG_SHA256"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: preflight
          image: ghcr.io/aero/aero-id@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: Always
          command: ["/app/preflight"]
          args: ["-config", "/etc/aero-id/config.yaml"]
          env:
            - name: AERO_ID_CONFIG_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['checksum/config']
            - name: AERO_ID_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: database_password}
            - name: AERO_ID_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: redis_password}
            - name: AERO_ID_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: signing_key}
            - name: AERO_ID_CALLBACK_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: callback_master_key}
            - name: AERO_ID_EVENT_INGEST_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: event_ingest_signing_key}
            - name: AERO_ID_AUDIT_LEDGER_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: audit_ledger_signing_key}
            - name: AERO_ID_EXPORT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: export_encryption_key}
            - name: AERO_ID_SOURCES_SNAPLINK_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: snaplink_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_SNAPLINK_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: snaplink_oauth_client_secret, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_oauth_client_secret, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_TARGET_ASSERTION_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_target_assertion_private_key, optional: true}
            - name: AERO_ID_SOURCES_AERO_VAULT_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_vault_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_AERO_VAULT_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_vault_oauth_client_secret, optional: true}
            - name: AERO_ID_REPLICATION_HTTP_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: replication_http_bearer_token, optional: true}
          volumeMounts:
            - name: config
              mountPath: /etc/aero-id
              readOnly: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aero-id
              tier: api
      containers:
        - name: aero-id
          image: ghcr.io/aero/aero-id@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          args: ["-config", "/etc/aero-id/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: AERO_ID_CONFIG_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['checksum/config']
            - name: AERO_ID_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: database_password}
            - name: AERO_ID_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: redis_password}
            - name: AERO_ID_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: signing_key}
            - name: AERO_ID_CALLBACK_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: callback_master_key}
            - name: AERO_ID_EVENT_INGEST_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: event_ingest_signing_key}
            - name: AERO_ID_AUDIT_LEDGER_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: audit_ledger_signing_key}
            - name: AERO_ID_EXPORT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: export_encryption_key}
            - name: AERO_ID_SOURCES_SNAPLINK_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: snaplink_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_SNAPLINK_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: snaplink_oauth_client_secret, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_oauth_client_secret, optional: true}
            - name: AERO_ID_SOURCES_AERO_IM_TARGET_ASSERTION_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_im_target_assertion_private_key, optional: true}
            - name: AERO_ID_SOURCES_AERO_VAULT_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_vault_bearer_token, optional: true}
            - name: AERO_ID_SOURCES_AERO_VAULT_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: aero_vault_oauth_client_secret, optional: true}
            - name: AERO_ID_REPLICATION_HTTP_BEARER_TOKEN
              valueFrom:
                secretKeyRef: {name: aero-id-secrets, key: replication_http_bearer_token, optional: true}
          volumeMounts:
            - name: config
              mountPath: /etc/aero-id
              readOnly: true
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: aero-id-config
            defaultMode: 0444
---
# P6-10: HPA driven by RPS/CPU. The api deployment is stateless, so scale-out
# is safe; account-affecting writes still route to the account home region.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aero-id-api
  namespace: aero-id
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aero-id-api
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aero-id-api
  namespace: aero-id
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aero-id
      tier: api
---
# Background workers (callbacks, audit publications, operations, sync, gc).
# Bulkheads bound in-flight outbound work; the DB leases fence concurrent
# workers (P5-02).
apiVersion: apps/v1
kind: Deployment
