syntax = "proto3";

package snaplink.audit.v1;

option go_package = "github.com/aero/aero-id/internal/sso/auditpb";

service AuditWriter {
  rpc StreamEvents(stream Event) returns (StreamAck);
  rpc Record(Event) returns (RecordAck);
}

message Event {
  string id = 1;
  string type = 2;
  string outcome = 3;
  int64 timestamp_unix = 4;
  string request_id = 5;
  string trace_id = 6;
  string span_id = 7;
  string parent_span_id = 8;
  string actor_id = 9;
  string actor_ip = 10;
  string user_agent = 11;
  string client_id = 12;
  string provider = 13;
  string token_strategy = 14;
  string session_id = 15;
  string token_id = 16;
  string reason = 17;
  map<string, string> metadata = 18;
}

message StreamAck {
  int64 received_count = 1;
  int64 persisted_count = 2;
}

message RecordAck {
  string id = 1;
}
