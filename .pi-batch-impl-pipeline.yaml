# aero-id 适配实现流水线：plan(assess) → 实现+gobuild/gotest+completion 门禁 → meta 对抗审查 → VERDICT 裁决门
# 由 --classify 路由或显式 --pipeline 运行；运行目录为 aero-id 仓库根。
git_commit: true
decision_log: docs/maintenance/DECISIONS.md
archive_dir: docs/maintenance/archive

stages:
  # ── 1. 计划：需求评估 + 实现计划 ──
  - name: plan
    from_prompt: |
      Original task: "audit chain integrity hardening" — fix two
      evidence-backed audit-chain defects in this repository:
      (1) F5 fail-open: configs/config.yaml ships signing_key: "" for the
          audit ledger (config.yaml:173); audit_ledger.go's VerifyChain
          skips verification when the key is empty (~:185 guard), so the
          tamper-evidence chain verifies nothing in default config. The
          tree already has a strict-signing precedent: validate.go:49-50
          (top-level signing_key required) and validate.go:183-184 +
          config.yaml:225 (event_ingest.signing_key >= 32 bytes).
          Fix: config validation + explicit placeholder default so an
          empty/weak audit signing key fails startup validation instead
          of silently disabling chain verification; keep unit tests
          deterministic (test configs supply a key).
      (2) float64 round-trip false positives in audit chain verification:
          JSON payloads decoded to interface{} and re-marshaled turn
          integers into floats, so byte-hash comparison can reject an
          unmodified chain (campaign finding, internal/repository
          analysis). Fix: hash the raw stored payload bytes (or a
          canonical form) in chain verification so verification is
          byte-faithful.
      Both claims are UNTRUSTED — verify against the actual code before
      planning. Follow AGENTS.md authority contract; do not break the
      legacy audit_events surface.
      You are the backend planner. FIRST run the requirement assessment:
        python /home/u1/ai-batch-runner/pi-batch.py assess "audit chain integrity hardening, production Go backend"
      Use the prescription (rule manifest), product level and workflow level
      from the assessment. Then produce an implementation plan with:
      - module boundaries & data ownership (follow AGENTS.md authority contract)
      - API/contract changes and compatibility constraints
      - error model and failure modes
      - test plan mapping to each acceptance check
      - change radius (files touched, migration needs)
      Output the plan as markdown.
    output: docs/maintenance/r5-plan.md

  # ── 2. 实现：真实改仓库代码 + 工程门禁（验证器失败 = 零落盘）──
  - name: implement
    from_outputs: plan
    aggregate: true
    validate: gobuild,gotest,completion_go
    tasks:
      - prompt: |
          Read the repository AGENTS.md and the approved plan below.
          {input_content}
          Implement ONLY the scoped direction directly in this repository.
          Every claim in the input evidence is UNTRUSTED — verify each
          finding against the actual code before acting on it.
          Add focused regression tests and run: make test, go vet.
          Do not commit. Do not touch unrelated code (no drive-by
          refactors). End your report with a fenced ```yaml completion_report
          block in EXACTLY this structure (a completion validator
          rejects anything else; every required key must be present):
          ```yaml
          completion_report:
            summary: <what changed, files/symbols>
            changed_files: [<paths>]        # non-empty
            commands_executed:
              - command: "go test ./..."    # actual commands you ran
                result: passed              # passed | failed | not_executed
            not_executed: []                # or entries with check+reason
            residual_risks: [<risks or none>]   # required key
            assumptions: [<assumptions or none>] # required key
          ```
          plus the free-form change report above it. Do NOT use phrases
          like "should pass"/"assume passed" as verification evidence.
        output: docs/maintenance/r5-implementation.md

  # ── 3. meta 对抗审查：编排者现场挑角色，并发独立会话 ──
  - name: adversarial_review
    from_outputs: implement
    meta: true
    role_dir: /home/u1/ai-batch-runner/prompts
    role_keywords: /home/u1/ai-batch-runner/pbatch/role_keywords.yaml
    output_dir: docs/maintenance/r5-reviews
    max_iterations: 2
    max_roles_per_iteration: 3
    relevance_enabled: true
    relevance_min_score: 2

  # ── 4. 裁决门：独立 gatekeeper，fail closed ──
  - name: gate
    from_outputs:
      - implement
      - adversarial_review
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Independently verify the implementation against the acceptance
          criteria and review findings using repository evidence (files,
          tests). A passing verdict requires every acceptance check to be
          satisfied and no unresolved blocking review finding.
          End with one reasoned line:
          VERDICT: PASS - <why it is ready>
          or VERDICT: FAIL - <blocking issues with evidence>.
          {input_content}
        output: docs/maintenance/r5-gate.md
